[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-wildlife-surveillance"
version = "0.1.0"
description = "Modular Edge AI and IoT surveillance pipeline for wildlife and intrusion monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Prashant Singh"}
]
dependencies = [
  "PyYAML>=6.0",
  "paho-mqtt>=2.0",
  "psutil>=5.9",
  "pyserial>=3.5"
]

[project.optional-dependencies]
vision = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "ultralytics>=8.2"
]
dev = [
  "pytest>=8.0"
]

[project.scripts]
edge-ai-surveillance = "edge_ai_surveillance.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
